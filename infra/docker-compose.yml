# Local infrastructure for the API. Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# The env file is passed explicitly because Compose otherwise looks for .env next to this file.

name: flagman

services:
  postgres:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Bound to localhost only: the database must not be reachable from the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Password comes from the environment so it does not appear in the compose file.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage, see docs/adr/0005-object-storage-seaweedfs.md.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Without these credentials SeaweedFS serves S3 anonymously, so they are mandatory.
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    # A fixed -ip keeps the volume server address stable across container restarts.
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -master.telemetry=false
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: creates the private bucket if it does not exist yet.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        list_buckets() { echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null; }
        if list_buckets | awk '{print $$1}' | grep -qxF "$$S3_BUCKET"; then
          echo "bucket $$S3_BUCKET already exists"
        else
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333
          list_buckets | awk '{print $$1}' | grep -qxF "$$S3_BUCKET"
          echo "bucket $$S3_BUCKET created"
        fi
    restart: "no"

  # Migrations are not run on start: `run --rm api alembic upgrade head`, see apps/api/README.md.
  api:
    # One image for the API and the worker, so rebuilding it updates both.
    image: flagman-api:local
    build:
      context: ../apps/api
    environment:
      # No default: a server must say prod or dev on purpose (#47).
      API_ENV: ${API_ENV:?set API_ENV in .env (dev locally, prod on a server)}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET in .env}
      API_OTP_PEPPER: ${API_OTP_PEPPER:?set API_OTP_PEPPER in .env}
      API_TOTP_ENCRYPTION_KEY: ${API_TOTP_ENCRYPTION_KEY:?set API_TOTP_ENCRYPTION_KEY in .env}
      SMS_BACKEND: ${SMS_BACKEND:-}
      SMS_FIXED_CODE: ${SMS_FIXED_CODE:-}
      SMS_FIXED_PHONES: ${SMS_FIXED_PHONES:-}
      # Read by uvicorn itself; the default is uvicorn's own.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:${S3_PORT:-8333}}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      KYC_MIN_AGE_YEARS: ${KYC_MIN_AGE_YEARS:-}
      KYC_MIN_DRIVING_YEARS: ${KYC_MIN_DRIVING_YEARS:-}
      FLEET_MIN_BATTERY_PCT: ${FLEET_MIN_BATTERY_PCT:-}
      FLEET_TELEMETRY_MAX_AGE_SECONDS: ${FLEET_TELEMETRY_MAX_AGE_SECONDS:-}
      # For `flagman-fleet seed`: the same values as the emulator, so the seeded cars get its ids.
      EMULATOR_SEED: ${EMULATOR_SEED:-42}
      EMULATOR_CAR_COUNT: ${EMULATOR_CAR_COUNT:-30}
      # Checks the emulator's telemetry webhooks and signs car commands (docs/adr/0007).
      EMULATOR_TELEMETRY_SECRET: ${EMULATOR_TELEMETRY_SECRET:?set EMULATOR_TELEMETRY_SECRET in .env}
      EMULATOR_COMMAND_SECRET: ${EMULATOR_COMMAND_SECRET:?set EMULATOR_COMMAND_SECRET in .env}
      EMULATOR_URL: ${EMULATOR_URL:-http://car-emulator:8100}
      TELEMATICS_COMMAND_TIMEOUT_SECONDS: ${TELEMATICS_COMMAND_TIMEOUT_SECONDS:-}
      TELEMATICS_SIGNATURE_TOLERANCE_SECONDS: ${TELEMATICS_SIGNATURE_TOLERANCE_SECONDS:-}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-}
      PAYMENTS_TOKEN_ENCRYPTION_KEY: ${PAYMENTS_TOKEN_ENCRYPTION_KEY:-}
      PAYMENTS_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENTS_WEBHOOK_TOLERANCE_SECONDS:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The bucket must exist before the first upload.
      seaweedfs-init:
        condition: service_completed_successfully
    # The API keeps no state on disk, so the container filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Periodic jobs, see docs/adr/0013. The image of the API, but only the database
  # settings: the worker signs and checks nothing, so it gets none of the API secrets.
  worker:
    # The same build and tag as the api service, so `up worker` alone still finds the image.
    image: flagman-api:local
    build:
      context: ../apps/api
    command: ["flagman-worker"]
    environment:
      API_ENV: ${API_ENV:?set API_ENV in .env (dev locally, prod on a server)}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      AUTH_CLEANUP_RETENTION_DAYS: ${AUTH_CLEANUP_RETENTION_DAYS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # The image checks the API's HTTP port, which the worker does not open. A crash ends the
    # process, and the restart policy brings it back.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Stands in for real telematics, see "Телематика и эмулятор" in docs/02-architecture.md.
  car-emulator:
    build:
      context: ../services/car-emulator
    environment:
      EMULATOR_COMMAND_SECRET: ${EMULATOR_COMMAND_SECRET:?set EMULATOR_COMMAND_SECRET in .env}
      EMULATOR_TELEMETRY_SECRET: ${EMULATOR_TELEMETRY_SECRET:?set EMULATOR_TELEMETRY_SECRET in .env}
      # The API in this compose file by default; while it is down, the emulator logs a warning per
      # batch and keeps going.
      EMULATOR_TELEMETRY_URL: ${EMULATOR_TELEMETRY_URL:-http://api:8000/fleet/telemetry}
      EMULATOR_CAR_COUNT: ${EMULATOR_CAR_COUNT:-30}
      EMULATOR_SEED: ${EMULATOR_SEED:-42}
      # The fleet's background life; empty means the emulator's default (see .env.example).
      EMULATOR_SIMULATION_ENABLED: ${EMULATOR_SIMULATION_ENABLED:-}
      EMULATOR_TIME_SCALE: ${EMULATOR_TIME_SCALE:-}
      EMULATOR_TRIP_SHARE: ${EMULATOR_TRIP_SHARE:-}
      EMULATOR_SPEED_KMH: ${EMULATOR_SPEED_KMH:-}
      EMULATOR_IDLE_DRAIN_PCT_PER_H: ${EMULATOR_IDLE_DRAIN_PCT_PER_H:-}
      EMULATOR_DRIVE_DRAIN_PCT_PER_KM: ${EMULATOR_DRIVE_DRAIN_PCT_PER_KM:-}
      EMULATOR_CHARGE_BELOW_PCT: ${EMULATOR_CHARGE_BELOW_PCT:-}
      EMULATOR_CHARGE_UNTIL_PCT: ${EMULATOR_CHARGE_UNTIL_PCT:-}
      EMULATOR_CHARGE_RATE_PCT_PER_H: ${EMULATOR_CHARGE_RATE_PCT_PER_H:-}
    ports:
      - "127.0.0.1:${EMULATOR_PORT:-8100}:8100"
    healthcheck:
      # The slim image has no curl or wget, so the check uses Python itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # State lives only in memory, so the same hardening as the API applies.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  seaweedfsdata:
