[project]
name = "flagman-api"
version = "0.1.0"
description = "FLAGMAN Drive backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flagman-staff = "flagman.identity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flagman"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "C4", "DTZ", "T20",
    "SIM", "PT", "RET", "RUF", "PL",
]

[tool.ruff.lint.isort]
known-first-party = ["flagman", "tools", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, magic status codes and throwaway passwords.
"**/tests/**" = ["S101", "S105", "S106", "PLR2004"]
"conftest.py" = ["S101"]
# Autogenerated revisions import sqlalchemy even when they do not use it.
"migrations/versions/*" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "tools", "migrations", "conftest.py"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (Postgres and Redis via testcontainers)"]

[tool.importlinter]
root_package = "flagman"
contract_types = ["foreign_internals: tools.import_contracts.ForeignInternalsContract"]

[[tool.importlinter.contracts]]
name = "Modules do not import other modules' models or repository"
type = "foreign_internals"
root_package = "flagman"
internal_submodules = ["models", "repository"]
