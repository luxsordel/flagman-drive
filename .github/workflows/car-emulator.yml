name: car-emulator

# Lint, types, tests and audit for the emulator run in ci.yml; this only checks that the image builds.
# Not a required check, so filtering by `paths` here does not block merges.
on:
  pull_request:
    paths:
      - services/car-emulator/**
      - .github/workflows/car-emulator.yml
  push:
    branches: [main]
    paths:
      - services/car-emulator/**
      - .github/workflows/car-emulator.yml

permissions:
  contents: read

jobs:
  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/car-emulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: docker build -t flagman/car-emulator:ci .
