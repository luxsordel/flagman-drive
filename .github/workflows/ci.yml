name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering happens here instead of in `on.paths`: a workflow skipped by `paths` never reports
  # a status, so a required check would hang forever. Jobs below are skipped, and the gate still reports.
  changes:
    name: Detect changed parts
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      api-client: ${{ steps.detect.outputs.api-client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
          else
            changed="__all__"
          fi
          # Editing CI itself re-checks everything.
          if echo "$changed" | grep -Eq '^(__all__|\.github/workflows/ci\.yml)$'; then all=1; else all=0; fi

          has() { [ "$all" = 1 ] || echo "$changed" | grep -Eq "$1"; }

          # A part is checked only once it exists; missing apps are skipped, not failed.
          python='[]'
          for dir in apps/api services/car-emulator; do
            if [ -f "$dir/pyproject.toml" ] && has "^$dir/"; then
              python=$(echo "$python" | jq -c --arg d "$dir" '. + [$d]')
            fi
          done

          # JS/TS parts are npm workspaces with one root lockfile, so they are checked together.
          node=false
          if [ -f package.json ] && has '^(package\.json|package-lock\.json|packages/|apps/(mobile|admin)/)'; then
            node=true
          fi

          # The generated client depends on the backend schema as well as on its own files.
          api_client=false
          if [ -f packages/api-client/package.json ] && { [ "$node" = true ] || has '^apps/api/'; }; then
            api_client=true
          fi

          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "api-client=$api_client" >> "$GITHUB_OUTPUT"

  python-quality:
    name: Python quality (${{ matrix.dir }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Module boundaries
        if: matrix.dir == 'apps/api'
        run: uv run lint-imports
      - name: Tests
        # Integration tests start Postgres/PostGIS and Redis through testcontainers (Docker is on the runner).
        run: uv run pytest -q

  python-audit:
    name: Python dependency audit (${{ matrix.dir }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  node-quality:
    name: Node quality (workspaces)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each workspace is expected to define these scripts; one that lacks them is skipped, not failed,
      # so a missing check in a new app must be caught in review.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Expo pins native module versions per SDK; a mismatch passes the checks above but crashes
      # on a device. Bundling catches what Jest cannot: Metro resolution, platform files, assets.
      - name: Expo SDK compatibility
        run: npm run check:deps --workspaces --if-present
      - name: Bundle for every platform
        run: npm run check:bundle --workspaces --if-present
      # Same threshold as `npm audit --audit-level=high`, minus advisories with no fix yet that are
      # listed with a reason and an expiry date in .github/npm-audit-allowlist.json.
      - name: Dependency audit (high and above)
        run: npm run audit

  api-client-fresh:
    name: Generated API client is up to date
    needs: changes
    if: needs.changes.outputs.api-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --project apps/api
      - run: npm ci
      - run: npm run gen:api
      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is stale. Run 'npm run gen:api' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git status --porcelain -- packages/api-client
            echo "::error::Generated files are not committed. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run Semgrep
        run: |
          uvx semgrep==1.182.1 scan --error --metrics=off \
            --config p/default --config p/python --config p/typescript --config p/security-audit

  # The only check added to branch protection (besides repo-checks): it always reports,
  # and passes when every job succeeded or was skipped by change detection.
  gate:
    name: CI gate
    if: always()
    needs: [changes, python-quality, python-audit, node-quality, api-client-fresh, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: Require no failed or cancelled jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
