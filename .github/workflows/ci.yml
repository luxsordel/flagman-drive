name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering happens here instead of in `on.paths`: a workflow skipped by `paths` never reports
  # a status, so a required check would hang forever. Jobs below are skipped, and the gate still reports.
  changes:
    name: Detect changed parts
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      api-client: ${{ steps.detect.outputs.api-client }}
      load-smoke: ${{ steps.detect.outputs.load-smoke }}
      caddy: ${{ steps.detect.outputs.caddy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
          else
            changed="__all__"
          fi
          # Editing CI itself re-checks everything.
          if echo "$changed" | grep -Eq '^(__all__|\.github/workflows/(ci|dependency-scans)\.yml)$'; then all=1; else all=0; fi

          has() { [ "$all" = 1 ] || echo "$changed" | grep -Eq "$1"; }

          # A part is checked only once it exists; missing apps are skipped, not failed.
          python='[]'
          for dir in apps/api services/car-emulator tests/load; do
            if [ -f "$dir/pyproject.toml" ] && has "^$dir/"; then
              python=$(echo "$python" | jq -c --arg d "$dir" '. + [$d]')
            fi
          done

          # JS/TS parts are npm workspaces with one root lockfile, so they are checked together.
          node=false
          if [ -f package.json ] && has '^(package\.json|package-lock\.json|packages/|apps/(mobile|admin)/)'; then
            node=true
          fi

          # The generated client depends on the backend schema as well as on its own files.
          api_client=false
          if [ -f packages/api-client/package.json ] && { [ "$node" = true ] || has '^apps/api/'; }; then
            api_client=true
          fi

          # What the scenarios run against, the scenarios themselves, their job and commands.
          load_smoke=false
          if has '^(apps/api/|services/car-emulator/|infra/docker-compose\.yml|tests/load/|\.github/workflows/ci\.yml|package\.json)'; then
            load_smoke=true
          fi

          # The stand's edge config and the check that runs it.
          caddy=false
          if has '^(infra/stand/web/(Caddyfile|Dockerfile)|scripts/check-caddy\.mjs)$'; then
            caddy=true
          fi

          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "api-client=$api_client" >> "$GITHUB_OUTPUT"
          echo "load-smoke=$load_smoke" >> "$GITHUB_OUTPUT"
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"

  python-quality:
    name: Python quality (${{ matrix.dir }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Module boundaries
        if: matrix.dir == 'apps/api'
        run: uv run lint-imports
      - name: Tests
        # Integration tests start Postgres/PostGIS and Redis through testcontainers (Docker is on the runner).
        run: uv run pytest -q

  # Its own job so the unit tests it reruns under tracing add no time to python-quality.
  domain-coverage:
    name: Domain coverage (apps/api)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.python), 'apps/api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Domain coverage
        # Unit tests only: domain code is tested without a database (tools/container_guard.py
        # fails an unmarked test that starts a container), and tracing would slow the integration
        # run. Fails below fail_under in pyproject.toml.
        run: uv run pytest -q -m "not integration" --cov --cov-report=term

  # Dependency audits and SAST live in their own workflow, which also runs weekly (scheduled-scans.yml).
  scans:
    name: Scans
    needs: changes
    uses: ./.github/workflows/dependency-scans.yml
    with:
      python-dirs: ${{ needs.changes.outputs.python }}
      node: ${{ needs.changes.outputs.node == 'true' }}

  node-quality:
    name: Node quality (workspaces)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each workspace is expected to define these scripts; one that lacks them is skipped, not failed,
      # so a missing check in a new app must be caught in review.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Expo pins native module versions per SDK; a mismatch passes the checks above but crashes
      # on a device. Bundling catches what Jest cannot: Metro resolution, platform files, assets.
      - name: Expo SDK compatibility
        run: npm run check:deps --workspaces --if-present
      - name: Bundle for every platform
        run: npm run check:bundle --workspaces --if-present

  api-client-fresh:
    name: Generated API client is up to date
    needs: changes
    if: needs.changes.outputs.api-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --project apps/api
      - run: npm ci
      - run: npm run gen:api
      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is stale. Run 'npm run gen:api' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git status --porcelain -- packages/api-client
            echo "::error::Generated files are not committed. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

  # Every scenario still runs on a real stack. Latency is not judged: runners are too noisy for it.
  load-smoke:
    name: Load test smoke run
    needs: changes
    if: needs.changes.outputs.load-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tests/load/uv.lock
      - run: uv sync --locked --project tests/load
      - run: uv run --project tests/load flagman-load local smoke
      - name: Show why the run failed
        if: failure()
        run: |
          cat tests/load/reports/*/locust_failures.csv || true
          cat tests/load/reports/*/locust_exceptions.csv || true
          tail -n 100 tests/load/reports/*/stack.log || true

  # The stand's Caddyfile in its pinned image: paths reach the logs, query strings and IPs do not.
  caddy:
    name: Stand edge config
    needs: changes
    if: needs.changes.outputs.caddy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-caddy.mjs

  # The only check added to branch protection (besides repo-checks): it always reports,
  # and passes when every job succeeded or was skipped by change detection.
  gate:
    name: CI gate
    if: always()
    needs: [changes, python-quality, domain-coverage, scans, node-quality, api-client-fresh, load-smoke, caddy]
    runs-on: ubuntu-latest
    steps:
      - name: Require no failed or cancelled jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
