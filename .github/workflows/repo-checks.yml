name: repo-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  shell-scripts:
    name: Shell scripts (shellcheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # shellcheck comes preinstalled on the GitHub Ubuntu runners.
      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh infra/stand/bin/*.sh infra/stand/tests/*.sh
      - name: Run script tests
        run: |
          for t in scripts/tests/*.test.sh infra/stand/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|test|docs|chore|ci|perf|security)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits, e.g. 'feat(rentals): add reservation timeout'"; exit 1; }
