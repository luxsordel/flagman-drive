version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /services/car-emulator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # One root lockfile for all npm workspaces (apps/mobile, apps/admin, packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The Expo SDK fixes these versions as one set (ADR-0008); separate bumps break `check:deps`.
      # Listed first: a dependency goes to the first group it matches.
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - jest-expo
          - react-native
          - react-native-*
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Changed only together with an SDK upgrade (`npx expo install expo@^NN --fix`, ADR-0008).
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major]
      # apps/mobile takes TypeScript from the SDK; packages/* move to a new major by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # React is pinned to the SDK's exact version for every workspace by root `overrides`.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
  # The Python version is a project-wide decision (ADR-0001, requires-python in pyproject.toml),
  # so Dependabot only gets patch releases of the python base image (3.12.x).
  - package-ecosystem: docker
    directory: /services/car-emulator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
