version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /services/car-emulator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /tests/load
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # One root lockfile for all npm workspaces (apps/mobile, apps/admin, packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The Expo SDK fixes these versions as one set (ADR-0008); separate bumps break `check:deps`.
      # Listed first: a dependency goes to the first group it matches.
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - jest-expo
          - react-native
          - react-native-*
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Changed only together with an SDK upgrade (`npx expo install expo@^NN --fix`, ADR-0008).
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major]
      # apps/mobile takes TypeScript from the SDK; packages/* move to a new major by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # React is pinned to the SDK's exact version for every workspace by root `overrides`.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
  # The Python version is a project-wide decision (ADR-0001, requires-python in pyproject.toml),
  # so Dependabot only gets patch releases of the python base image (3.12.x).
  - package-ecosystem: docker
    directory: /services/car-emulator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  # The stand's edge image: node only builds the web bundles, caddy serves them (docs/adr/0021).
  # Node stays on the 22 line that CI and `engines` use, so a new major is a decision made by hand.
  - package-ecosystem: docker
    directory: /infra/stand/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Third-party images of the local and stand compose files; the stand's own images come from GHCR
  # and are built from the Dockerfiles above. Majors of the data stores are decisions made by hand:
  # a new Postgres major needs a dump and restore of the volume, and SeaweedFS keeps the KYC photos
  # on a pinned version (docs/adr/0005).
  - package-ecosystem: docker-compose
    directories:
      - /infra
      - /infra/stand
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # One PR per image across both directories: the stand's backup must run the same Postgres
        # image as the database (tests/test_compose_images.py), so a bump of one file alone fails.
        group-by: dependency-name
    ignore:
      - dependency-name: postgis/postgis
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: chrislusf/seaweedfs
        update-types: [version-update:semver-major]
