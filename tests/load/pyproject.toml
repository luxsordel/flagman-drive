[project]
name = "flagman-load"
version = "0.1.0"
description = "Load test of the FLAGMAN Drive pilot: scenarios, targets and the run command"
requires-python = ">=3.12,<3.13"
dependencies = [
    "locust>=2.43.0",
    "pillow>=12.0.0",
    "pyotp>=2.10.0",
    "requests>=2.32.5",
    "websocket-client>=1.9.0",
]

[project.scripts]
flagman-load = "flagman_load.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "responses>=0.25.8",
    "ruff>=0.17.1",
    "types-requests>=2.32.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
# The run command starts docker and locust with fixed arguments.
"src/flagman_load/stack.py" = ["S603", "S607"]
"src/flagman_load/cli.py" = ["S603"]
# The choice of a car or a pause is load shaping, not security.
"src/flagman_load/locustfile.py" = ["S311"]
"src/flagman_load/rental_flow.py" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
# ci.yml runs bare `mypy`, so the targets live here.
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Ships no type hints.
module = ["gevent.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
